name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows one-file EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0

      - name: Build EXE with PyInstaller
        # --onefile          : один .exe (распаковывается во временную папку)
        # --windowed         : без консольного окна (GUI приложение)
        # --collect-all customtkinter : тащим темы/ассеты customtkinter
        # --name             : имя выходного бинарника
        run: |
          pyinstaller --onefile --windowed `
            --name "VLESS-Aggregator-Checker" `
            --collect-all customtkinter `
            --hidden-import dns.resolver `
            --hidden-import telethon `
            app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VLESS-Aggregator-Checker-windows-exe
          path: dist/VLESS-Aggregator-Checker.exe
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VLESS-Aggregator-Checker.exe
          generate_release_notes: true
